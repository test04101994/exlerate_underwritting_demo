[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-classifier"
version = "0.4.0"
description = "LangGraph-orchestrated, configurable document classification engine (Claude on Amazon Bedrock); runs as an AWS Lambda."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.40",
    "anthropic[bedrock]>=0.40.0",
    "boto3>=1.34",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]
